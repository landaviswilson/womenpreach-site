<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just for Fun — Clergywomen's Retreat 2026</title>
<style>
  :root{
    --plum:#3f1b6b; --plum-dark:#241440; --night:#202a45; --rose:#7a3a9a;
    --bg:#fbf7ef; --card:#ffffff; --ink:#241b2a; --muted:#6f6478;
    --line:#ece4d6; --gold:#b87a0e; --sun:#f0c050; --live:#1f9d55; --bad:#c0392b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45;padding:0 0 40px}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px}
  .band{background:linear-gradient(160deg,var(--night),var(--plum) 55%,var(--plum-dark));color:#fff;text-align:center;
    padding:18px 16px 16px;border-bottom:5px solid var(--sun);position:relative;overflow:hidden}
  .band::before{content:"🎲";position:absolute;right:-4px;top:-18px;font-size:120px;opacity:.10;line-height:1}
  .band h1{margin:0;font-size:21px;position:relative}
  .band .tag{margin-top:4px;font-size:13px;color:var(--sun);font-weight:650;position:relative}
  .band a.back{color:#dcc9e3;font-size:12.5px;text-decoration:none;display:inline-block;margin-top:8px;position:relative}

  .menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:16px}
  .menu-h{grid-column:1/-1;margin:0 0 2px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .mi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:#fff;border:1px solid var(--line);
    border-left:5px solid var(--sun);border-radius:14px;padding:14px 14px 13px;cursor:pointer;box-shadow:0 4px 16px rgba(60,20,80,.06);min-height:112px}
  .mi:active{background:#f6f1f8}
  .mi-i{font-size:24px;line-height:1}
  .mi-t{font-weight:750;font-size:16px;color:var(--plum);margin-top:4px}
  .mi-s{font-size:12.5px;color:var(--muted);line-height:1.3}
  .backbtn{margin-top:14px;border:0;background:transparent;color:var(--plum);font-weight:700;font-size:14px;padding:6px 0;cursor:pointer}
  .panel{display:none}.panel.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 6px 22px rgba(60,20,80,.07)}
  h2{margin:0 0 4px;font-size:19px;color:var(--plum)}
  .sub{font-size:13.5px;color:var(--muted);margin-bottom:10px}
  input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;background:var(--plum);color:#fff;
    padding:11px 16px;border-radius:11px;font-weight:650;font-size:15px;text-decoration:none}
  .btn.alt{background:#fff;color:var(--plum);border:1px solid var(--plum)}
  .btn.gold{background:var(--gold)}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

  /* trivia */
  .qhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .timer{height:6px;background:var(--line);border-radius:4px;margin:8px 0 12px;overflow:hidden}
  .timer i{display:block;height:100%;background:var(--sun);width:100%;transition:width .25s linear}
  .q{font-size:18px;font-weight:700;line-height:1.3;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:15.5px;margin-top:8px;cursor:pointer;font-weight:600;color:var(--ink)}
  .opt.right{border-color:var(--live);background:#eef7f0}
  .opt.wrong{border-color:var(--bad);background:#fdeeec}
  .opt:disabled{cursor:default}
  .fb{font-size:13.5px;color:var(--muted);margin-top:10px;min-height:20px}
  .score{font-size:40px;font-weight:800;color:var(--plum);line-height:1}
  .lb{margin-top:8px}
  .lb .r{display:flex;justify-content:space-between;padding:8px 10px;border-radius:9px;font-size:14.5px}
  .lb .r:nth-child(odd){background:#f6f1f8}
  .lb .r b{color:var(--plum)}
  .lb .r.me{outline:2px solid var(--sun)}
  .medal{width:26px;display:inline-block}

  /* word search */
  .ws{display:grid;gap:2px;user-select:none;touch-action:none;margin-top:10px}
  .ws .c{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;font-weight:700;border-radius:5px;background:#fff;
    border:1px solid var(--line);font-size:clamp(11px,3.6vw,18px)}
  .ws .c.sel{background:var(--sun);border-color:var(--gold)}
  .ws .c.found{background:#e4d4f2;border-color:#c9b0e0;color:var(--plum)}
  .wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .wl span{font-size:12.5px;font-weight:650;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--plum)}
  .wl span.done{text-decoration:line-through;opacity:.45}

  /* crossword */
  .cw{display:grid;gap:1px;background:var(--ink);padding:1px;border-radius:6px;margin-top:10px;touch-action:manipulation}
  .cw .k{aspect-ratio:1;min-width:0;background:#fff;position:relative}
  .cw .k.blk{background:var(--ink)}
  .cw .k input{width:100%;min-width:0;height:100%;border:0;text-align:center;font-weight:700;text-transform:uppercase;font-size:clamp(11px,3.4vw,18px);background:transparent;color:var(--ink);padding:0;caret-color:var(--plum)}
  .cw .k input:focus{outline:none;background:#fff3cf}
  .cw .k.hl input{background:#f3e9fb}
  .cw .k.ok input{color:var(--live)}
  .cw .k.bad input{color:var(--bad)}
  .cw .k .n{position:absolute;left:2px;top:0;font-size:8px;font-weight:700;color:var(--muted)}
  .clues{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  @media(max-width:480px){.clues{grid-template-columns:1fr}}
  .clues h4{margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .clue{font-size:13.5px;padding:5px 7px;border-radius:7px;cursor:pointer}
  .clue.on{background:#f3e9fb}
  .clue b{color:var(--plum)}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;line-height:1.6}
</style>
</head>

function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------------- TRIVIA CONTENT (fact-checked Oct 2026) ---------------- */

/* ---------------- TRIVIA ENGINE ---------------- */
var PER_Q=15, SECS=20;
function trivia(id){
  var T=TRIVIA[id], el=document.getElementById('p-'+id), st={};
  var saved=''; try{saved=localStorage.getItem('wp_name')||'';}catch(e){}
  function start(){
    el.innerHTML='<div class="card"><h2>'+T.title+'</h2><div class="sub">'+T.sub+'</div>'+
      '<label style="font-size:13px;font-weight:700;color:var(--muted)">Your name (for the leaderboard)</label>'+
      '<input type="text" id="nm-'+id+'" maxlength="24" placeholder="e.g. Rev. Sue" value="'+esc(saved)+'">'+
      '<div class="row"><button class="btn gold" id="go-'+id+'">Start the quiz →</button></div></div>'+
      '<div class="card"><h2>Leaderboard</h2><div class="sub">Top 10 right now</div><div class="lb" id="lb-'+id+'"></div></div>';
    document.getElementById('go-'+id).onclick=function(){
      var n=document.getElementById('nm-'+id).value.trim(); if(!n){alert('Add your name first!');return;}
      try{localStorage.setItem('wp_name',n);}catch(e){}
      st={name:n,qs:shuffle(T.qs).slice(0,PER_Q),i:0,score:0,right:0}; ask();
    };
    watchLB(T.key,'lb-'+id,null);
  }
  function ask(){
    if(st.i>=st.qs.length) return finish();
    var q=st.qs[st.i], opts=shuffle([q.a].concat(q.o)), t0=Date.now(), done=false, tm;
    el.innerHTML='<div class="card"><div class="qhead"><span>Question '+(st.i+1)+' of '+st.qs.length+'</span><span>Score '+st.score+'</span></div>'+
      '<div class="timer"><i id="bar-'+id+'"></i></div><div class="q">'+esc(q.q)+'</div>'+
      opts.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>';}).join('')+
      '<div class="fb" id="fb-'+id+'"></div><div class="row"><button class="btn" id="nx-'+id+'" style="display:none">Next →</button></div></div>';
    var bar=document.getElementById('bar-'+id);
    tm=setInterval(function(){var left=Math.max(0,SECS-(Date.now()-t0)/1000);bar.style.width=(left/SECS*100)+'%';if(left<=0){clearInterval(tm);answer(null);}},250);
    function answer(choice){
      if(done)return; done=true; clearInterval(tm);
      var secs=(Date.now()-t0)/1000, pts=0;
      if(choice===q.a){ pts=100+Math.round(Math.max(0,SECS-secs)/SECS*50); st.score+=pts; st.right++; }
      var btns=el.querySelectorAll('.opt');
      btns.forEach(function(b){ b.disabled=true; if(b.textContent===q.a)b.classList.add('right'); else if(choice!==null&&b.textContent===choice)b.classList.add('wrong'); });
      document.getElementById('fb-'+id).innerHTML=(choice===q.a?'<b style="color:var(--live)">Correct! +'+pts+'</b> · ':(choice===null?'<b style="color:var(--bad)">Time\'s up.</b> ':'<b style="color:var(--bad)">Not quite.</b> '))+esc(q.f);
      var nx=document.getElementById('nx-'+id); nx.style.display='inline-flex'; nx.textContent=(st.i+1<st.qs.length?'Next →':'See my score →');
      nx.onclick=function(){st.i++;ask();};
    }
    el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(b.textContent);};});
  }
  function finish(){
    var rec={name:st.name,score:st.score,right:st.right,ts:Date.now()}, myKey=null;
    if(db){ try{ myKey=db.ref('womenpreach/lb/'+T.key).push(rec).key; }catch(e){} }
    el.innerHTML='<div class="card" style="text-align:center"><div class="sub">'+esc(st.name)+', you scored</div><div class="score">'+st.score+'</div>'+
      '<div class="sub" style="margin-top:6px">'+st.right+' of '+st.qs.length+' correct</div>'+
      '<div class="row" style="justify-content:center"><button class="btn gold" id="again-'+id+'">Play again</button></div></div>'+
      '<div class="card"><h2>Leaderboard</h2><div class="sub">Top 10 right now</div><div class="lb" id="lb-'+id+'"></div></div>';
    document.getElementById('again-'+id).onclick=start;
    watchLB(T.key,'lb-'+id,myKey);
  }
  start();
}
var lbWatch={};
function watchLB(key,elId,myKey){
  var box=document.getElementById(elId);
  if(!db){ box.innerHTML='<div class="sub">Leaderboard unavailable offline.</div>'; return; }
  if(lbWatch[key]) lbWatch[key].off();
  var ref=db.ref('womenpreach/lb/'+key).orderByChild('score').limitToLast(50);
  lbWatch[key]=ref;
  ref.on('value',function(s){
    var arr=[]; s.forEach(function(c){var v=c.val();v._k=c.key;arr.push(v);});
    arr.sort(function(a,b){return b.score-a.score||a.ts-b.ts;});
    var b=document.getElementById(elId); if(!b)return;
    if(!arr.length){b.innerHTML='<div class="sub">No scores yet — be the first!</div>';return;}
    var medals=['🥇','🥈','🥉'];
    b.innerHTML=arr.slice(0,10).map(function(r,i){

    }).join('');
  });
}

/* ---------------- WORD SEARCH ---------------- */
function wordsearch(id,P,title,sub){
  var el=document.getElementById('p-'+id), N=P.size, found={}, t0=null;
  el.innerHTML='<div class="card"><h2>'+title+'</h2><div class="sub">'+sub+' Drag across the letters (any direction, forwards or backwards).</div>'+
    '<div class="ws" id="g-'+id+'" style="grid-template-columns:repeat('+N+',minmax(0,1fr))"></div><div class="wl" id="l-'+id+'"></div><div class="fb" id="m-'+id+'"></div></div>';
  var g=document.getElementById('g-'+id), cells=[];
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){var c=document.createElement('div');c.className='c';c.textContent=P.rows[y][x];c.dataset.x=x;c.dataset.y=y;g.appendChild(c);cells.push(c);}
  var L=document.getElementById('l-'+id);
  L.innerHTML=P.words.map(function(w){return '<span id="w-'+id+'-'+w.w+'">'+w.w+'</span>';}).join('');
  var start=null, cur=[];
  function cellAt(ev){var t=ev.touches?ev.touches[0]:ev; var e=document.elementFromPoint(t.clientX,t.clientY); return (e&&e.classList.contains('c')&&e.parentNode===g)?e:null;}
  function line(a,b){ var x0=+a.dataset.x,y0=+a.dataset.y,x1=+b.dataset.x,y1=+b.dataset.y, dx=x1-x0, dy=y1-y0;
    if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy))) return null;
    var n=Math.max(Math.abs(dx),Math.abs(dy)), sx=Math.sign(dx), sy=Math.sign(dy), out=[];
    for(var i=0;i<=n;i++) out.push(cells[(y0+sy*i)*N+(x0+sx*i)]); return out; }
  function paint(){cells.forEach(function(c){c.classList.remove('sel');});cur.forEach(function(c){c.classList.add('sel');});}
  function down(ev){ var c=cellAt(ev); if(!c)return; ev.preventDefault(); if(!t0)t0=Date.now(); start=c; cur=[c]; paint(); }
  function move(ev){ if(!start)return; var c=cellAt(ev); if(!c)return; ev.preventDefault(); var l=line(start,c); if(l){cur=l;paint();} }
  function up(){ if(!start)return; var s=cur.map(function(c){return c.textContent;}).join(''), r=s.split('').reverse().join('');
    P.words.forEach(function(w){ if(!found[w.w]&&(s===w.w||r===w.w)){ found[w.w]=1; cur.forEach(function(c){c.classList.add('found');}); document.getElementById('w-'+id+'-'+w.w).classList.add('done'); } });
    start=null;cur=[];paint();
    var n=Object.keys(found).length; var m=document.getElementById('m-'+id);
    if(n===P.words.length){ m.innerHTML='<b style="color:var(--live)">You found them all in '+Math.round((Date.now()-t0)/1000)+' seconds! 🎉</b>'; }
    else m.textContent=n+' of '+P.words.length+' found'; }
  g.addEventListener('pointerdown',down); g.addEventListener('pointermove',move); window.addEventListener('pointerup',up);
  g.addEventListener('touchstart',down,{passive:false}); g.addEventListener('touchmove',move,{passive:false}); g.addEventListener('touchend',up);
}

/* ---------------- CROSSWORD ---------------- */
function crossword(id,P,title,sub){
  var el=document.getElementById('p-'+id), W=P.w, H=P.h;
  var sol={}, nums={};
  P.entries.forEach(function(e){ for(var i=0;i<e.a.length;i++){ var x=e.x+(e.d==='A'?i:0), y=e.y+(e.d==='D'?i:0); sol[x+','+y]=e.a[i]; } nums[e.x+','+e.y]=e.n; });
  el.innerHTML='<div class="card"><h2>'+title+'</h2><div class="sub">'+sub+'</div>'+
    '<div class="cw" id="g-'+id+'" style="grid-template-columns:repeat('+W+',minmax(0,1fr))"></div>'+
    '<div class="row"><button class="btn" id="chk-'+id+'">Check</button><button class="btn alt" id="rev-'+id+'">Reveal all</button><button class="btn alt" id="clr-'+id+'">Clear</button></div>'+
    '<div class="fb" id="m-'+id+'"></div>'+
    '<div class="clues"><div><h4>Across</h4>'+P.entries.filter(function(e){return e.d==='A';}).map(function(e){return '<div class="clue" data-n="'+e.n+'" data-d="A"><b>'+e.n+'.</b> '+esc(e.c)+'</div>';}).join('')+'</div>'+
    '<div><h4>Down</h4>'+P.entries.filter(function(e){return e.d==='D';}).map(function(e){return '<div class="clue" data-n="'+e.n+'" data-d="D"><b>'+e.n+'.</b> '+esc(e.c)+'</div>';}).join('')+'</div></div></div>';
  var g=document.getElementById('g-'+id), inp={};
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){ var k=document.createElement('div'); var key=x+','+y;
    if(sol[key]){ k.className='k'; if(nums[key]) k.innerHTML='<span class="n">'+nums[key]+'</span>';
      var i=document.createElement('input'); i.maxLength=1; i.autocomplete='off'; i.dataset.key=key; i.setAttribute('inputmode','text'); k.appendChild(i); inp[key]=i; }
    else k.className='k blk'; g.appendChild(k); }
  var dir='A';
  function entryAt(key,d){ return P.entries.filter(function(e){ if(e.d!==d)return false; var x=+key.split(',')[0], y=+key.split(',')[1];
    return d==='A'? (y===e.y&&x>=e.x&&x<e.x+e.a.length) : (x===e.x&&y>=e.y&&y<e.y+e.a.length); })[0]; }
  function hl(key){ Object.keys(inp).forEach(function(k){inp[k].parentNode.classList.remove('hl');}); el.querySelectorAll('.clue').forEach(function(c){c.classList.remove('on');});
    var e=entryAt(key,dir)||entryAt(key,dir==='A'?'D':'A'); if(!e)return; dir=e.d;
    for(var i=0;i<e.a.length;i++){var k=(e.x+(e.d==='A'?i:0))+','+(e.y+(e.d==='D'?i:0)); inp[k].parentNode.classList.add('hl');}
    var c=el.querySelector('.clue[data-n="'+e.n+'"][data-d="'+e.d+'"]'); if(c)c.classList.add('on'); }
  function step(key,back){ var x=+key.split(',')[0], y=+key.split(',')[1]; var nx=x+(dir==='A'?(back?-1:1):0), ny=y+(dir==='D'?(back?-1:1):0); var n=inp[nx+','+ny]; if(n){n.focus();n.select();} }
  Object.keys(inp).forEach(function(key){ var i=inp[key];
    i.addEventListener('focus',function(){hl(key);});
    i.addEventListener('click',function(){ if(document.activeElement===i){ var o=dir==='A'?'D':'A'; if(entryAt(key,o)){dir=o;hl(key);} } });
    i.addEventListener('input',function(){ i.value=i.value.replace(/[^a-z]/ig,'').toUpperCase().slice(-1); i.parentNode.classList.remove('ok','bad'); if(i.value) step(key,false); });
    i.addEventListener('keydown',function(ev){ if(ev.key==='Backspace'&&!i.value){step(key,true);}
      if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){dir='A';hl(key);step(key,ev.key==='ArrowLeft');ev.preventDefault();}
      if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){dir='D';hl(key);step(key,ev.key==='ArrowUp');ev.preventDefault();} });
  });
  el.querySelectorAll('.clue').forEach(function(c){ c.onclick=function(){ var e=P.entries.filter(function(e){return e.n==+c.dataset.n&&e.d===c.dataset.d;})[0]; dir=e.d; var k=inp[e.x+','+e.y]; k.focus(); hl(e.x+','+e.y); }; });
  document.getElementById('chk-'+id).onclick=function(){ var ok=0,tot=0,filled=0; Object.keys(inp).forEach(function(k){ tot++; var v=inp[k].value; inp[k].parentNode.classList.remove('ok','bad'); if(v){filled++; if(v===sol[k]){ok++;inp[k].parentNode.classList.add('ok');} else inp[k].parentNode.classList.add('bad');} });
    document.getElementById('m-'+id).innerHTML= ok===tot ? '<b style="color:var(--live)">Perfect — every square is right! 🎉</b>' : ok+' of '+tot+' letters correct ('+(filled-ok)+' wrong, '+(tot-filled)+' blank).'; };
  document.getElementById('rev-'+id).onclick=function(){ if(!confirm('Reveal the whole puzzle?'))return; Object.keys(inp).forEach(function(k){inp[k].value=sol[k];inp[k].parentNode.classList.remove('bad');inp[k].parentNode.classList.add('ok');}); };
  document.getElementById('clr-'+id).onclick=function(){ Object.keys(inp).forEach(function(k){inp[k].value='';inp[k].parentNode.classList.remove('ok','bad');}); document.getElementById('m-'+id).textContent=''; };
}
